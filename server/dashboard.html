<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job search</title>
<style>
:root {
  --grid: #E9EDF3; --edge: rgba(22, 32, 46, 0.35);
  --paper: #F4F6FB; --ink: #16202E; --accent: #1F6FE5; --muted: #6B7686;
  --border: #D9DEE7; --danger: #C0392B; --ok: #1E8E5A; --warn: #B7791F; --surface: #FFFFFF;
  --ok-bg: rgba(30, 142, 90, 0.12); --warn-bg: rgba(183, 121, 31, 0.14);
  --danger-bg: rgba(192, 57, 43, 0.12); --neutral-bg: rgba(107, 118, 134, 0.12);
  --hover: rgba(127, 127, 127, 0.08); --accent-soft: rgba(31, 111, 229, 0.10);
  --on-accent: #FFFFFF; --scrim: rgba(22, 32, 46, 0.45); --shadow: 0 8px 28px rgba(22, 32, 46, 0.18);
  --email: #C0392B; --email-bg: rgba(192, 57, 43, 0.07); --li: #0A66C2; --li-bg: rgba(10, 102, 194, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --grid: #1A2637; --edge: rgba(0, 0, 0, 0.6);
    --paper: #0C1622; --ink: #ECF1F8; --accent: #5B9BFF; --border: #24324A; --surface: #101B2B; --muted: #8A96A8;
    --ok-bg: rgba(30, 142, 90, 0.18); --warn-bg: rgba(183, 121, 31, 0.2);
    --danger-bg: rgba(192, 57, 43, 0.2); --neutral-bg: rgba(138, 150, 168, 0.16);
    --accent-soft: rgba(91, 155, 255, 0.14); --on-accent: #0C1622; --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    --email: #F07A6C; --email-bg: rgba(240, 122, 108, 0.10); --li: #6BAEF5; --li-bg: rgba(107, 174, 245, 0.11);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; overflow-x: clip; }
body { background: var(--paper); color: var(--ink); font: 13px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; min-height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.icon { width: 16px; height: 16px; flex-shrink: 0; display: inline-block; color: currentColor; }
.icon svg { display: block; width: 100%; height: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- Buttons ---------- */
button, .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 0 12px; min-height: 36px; cursor: pointer; text-decoration: none; color: var(--ink);
  transition: border-color 0.12s ease, background-color 0.12s ease, color 0.12s ease;
  white-space: nowrap;
}
button:hover:not(:disabled), .btn:hover { border-color: var(--accent); text-decoration: none; }
button:active:not(:disabled) { background: var(--hover); }
button:disabled { opacity: 0.5; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-approve { min-height: 44px; padding: 0 30px; font-size: 14px; font-weight: 700; border-radius: 8px; }
.btn-sm { min-height: 30px; padding: 0 10px; font-size: 12px; }
.btn-quiet { background: transparent; }
.btn-icon { width: 36px; padding: 0; }

/* ---------- Waiting strip ---------- */
#strip { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 22px; padding: 10px 16px; min-height: 58px; }
.strip-label { font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: var(--muted); }
.strip-counts { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; }
.wait-item { display: inline-flex; align-items: baseline; gap: 6px; color: var(--ink); border-radius: 4px; }
.wait-item:hover { text-decoration: none; }
.wait-item:hover .wait-text { text-decoration: underline; }
.wait-num { font-size: 22px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.wait-item.approve .wait-num { color: var(--accent); }
.wait-item.failed .wait-num { color: var(--danger); }
.wait-item.people .wait-num { color: var(--accent); }
.wait-item.inbox .wait-num { color: var(--accent); }
.strip-none { font-size: 14px; }
.strip-right { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; color: var(--muted); }
.strip-next { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.paused-mark { display: inline-flex; align-items: center; gap: 5px; background: var(--warn-bg); color: var(--warn); font-weight: 600; padding: 3px 9px; border-radius: 999px; }

/* ---------- Tabs ---------- */
#tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--paper); }
#tabs a { padding: 10px 14px 9px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; border-radius: 4px 4px 0 0; }
#tabs a:hover { color: var(--ink); text-decoration: none; }
#tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

#down { display: flex; align-items: center; gap: 8px; margin: 12px 16px 0; padding: 8px 10px; border: 1px solid var(--danger); background: var(--danger-bg); color: var(--danger); border-radius: 6px; }
#view { padding: 16px 20px 60px; }

/* ---------- Jobs ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 auto; }
.chip-btn { border-radius: 999px; min-height: 28px; padding: 0 11px; font-size: 12px; color: var(--muted); }
.chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip-btn b { font-weight: 700; font-variant-numeric: tabular-nums; margin-left: 2px; }
/* One line box for the label and the bold count, so they share a baseline: as separate flex
   items the bold count sat half a pixel lower. */
.chip-btn { display: inline-block; line-height: 26px; }
.search { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px 0 10px; width: 260px; max-width: 100%;
  border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--muted); }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1 1 0; min-width: 0; border: 0; background: transparent; padding: 0 0 1px; outline: none; color: var(--ink); }
/* Optical alignment: the eye lines the magnifier's circle up with the lowercase letters, which sat
   about 1.7px lower than the circle. Icon down 1px, text up half a pixel. */
.search .icon { position: relative; top: 1px; }
.search input::placeholder { color: var(--muted); }
.search input:focus-visible { outline: none; }
.search:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

table.jobs { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
/* Pinned headers: tucked 1px under the strip and under each other, with their lines drawn as inset shadows. In a
   collapsed-border table a border stays behind when its cell sticks, which let rows show through a sliver. */
.jobs th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: var(--muted); padding: 9px 12px; border-bottom: 0; white-space: nowrap;
  position: sticky; top: calc(var(--strip-h, 0px) - 1px); z-index: 3; background: var(--surface); box-shadow: inset 0 -1px 0 var(--border); }
.jobs td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.jobs thead th:first-child { border-top-left-radius: 6px; } .jobs thead th:last-child { border-top-right-radius: 6px; }
.jobs tbody tr:last-child td { border-bottom: 0; }
.jobs tbody tr:hover { background: var(--hover); }
/* Group headers: a quiet band, not a row; the count sits beside the name. */
.jobs tr.group-row th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink); background: var(--paper); padding: 7px 12px;
  border: 0; letter-spacing: 0; box-shadow: inset 0 -1px 0 var(--border), inset 0 1px 0 var(--border);
  /* Sticks right under the column headings (their measured height), so the group you are scrolling through stays named. */
  top: calc(var(--strip-h, 0px) + var(--jobs-head-h, 35px) - 2px); z-index: 2; }
.jobs tbody tr.group-row:hover { background: none; }
.group-n { margin-left: 8px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.c-date { width: 66px; white-space: nowrap; color: var(--muted); }
.c-company { width: 210px; font-weight: 600; overflow-wrap: anywhere; }
.co { display: flex; align-items: center; gap: 8px; position: relative; }
.co-links { display: inline-flex; gap: 2px; flex: none; }
.co-link { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; min-height: 0; padding: 0; border: 0; border-radius: 5px; background: transparent; color: var(--muted); cursor: pointer; }
.co-link .icon svg { width: 15px; height: 15px; }
.co-link:hover { color: var(--accent); background: var(--hover); text-decoration: none; border: 0; }
.co-link[aria-expanded="true"] { color: var(--accent); background: var(--accent-soft); }
.co-pop { font-weight: 400; z-index: 8; }
.co-form { display: flex; flex-direction: column; gap: 10px; }
.co-cur { overflow-wrap: anywhere; font-size: 12px; }
.co-link.is-off { opacity: 0.5; }
.co-link.is-off:hover, .co-link.is-off[aria-expanded="true"] { opacity: 1; }
a.co-name { color: var(--ink); }
a.co-name:hover { color: var(--accent); }
/* Share the width across the row instead of handing every spare pixel to Role (wide screens left a
   gap between the title and its score). Percentages above the stacked breakpoint only. */
@media (min-width: 1181px) {
  table.jobs { table-layout: fixed; }
  .jobs .c-date { width: 6%; } .jobs .c-company { width: 16%; } .jobs .c-role { width: 25%; min-width: 0; }
  .jobs .c-score { width: 5%; } .jobs .c-status { width: 9%; } .jobs .c-inbox { width: 14%; } .jobs .c-pipe { width: 25%; }
  .co-name { min-width: 0; }
}
/* Faint column lines, so a row reads across. */
.jobs th + th, .jobs td + td { border-left: 1px solid var(--grid); }
.fit { margin-right: 8px; font-variant-numeric: tabular-nums; }
.fit b { font-weight: 800; }
.fact { display: flex; align-items: flex-start; gap: 7px; }
.fact .icon { flex: none; margin-top: 1px; }
.fact .icon svg { width: 14px; height: 14px; }
.c-role { min-width: 240px; }
.c-score { width: 56px; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.c-status { width: 132px; }
.c-resume { width: 66px; color: var(--muted); font-variant-numeric: tabular-nums; }
.c-pipe { width: 260px; }
.c-inbox { width: 130px; }
.inbox-link { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; color: var(--muted); border-radius: 4px; }
.inbox-link:hover { text-decoration: none; }
.inbox-link:hover .pill { filter: brightness(0.95); }
.inbox-link .when { font-variant-numeric: tabular-nums; }
/* Handoff note: a link that opens the markdown as text, and a Copy for pasting it into claude.ai. */
.handoff-links { display: flex; align-items: center; gap: 2px 4px; flex-wrap: wrap; margin-top: 3px; font-size: 12px; }
.handoff-links a { font-size: 12px; font-weight: 500; }
.handoff-links .icon-only { display: inline-grid; place-items: center; width: 24px; height: 24px; min-height: 0; padding: 0; border: 0;
  border-radius: 4px; background: transparent; color: var(--muted); }
.handoff-links .icon-only .icon, .handoff-links .icon-only svg { width: 14px; height: 14px; }
.handoff-links .icon-only:hover:not(:disabled) { color: var(--accent); background: var(--hover); }
.handoff-links .icon-only:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.handoff-links .icon-only.is-done { color: var(--ok); }
.ic-head .handoff-links { margin-top: 0; }
.handoff-links .err { flex-basis: 100%; }
.needs-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
/* The divider between the job and its outreach. */
.jobs th.c-pipe, .jobs td.c-pipe { border-left: 2px solid var(--border); padding-left: 12px; }
.pipe-cell { position: relative; }
.pipe-btn { display: flex; flex-direction: column; align-items: stretch; gap: 7px; width: 100%; min-height: 44px; padding: 8px 10px;
  background: transparent; border: 1px solid transparent; border-radius: 8px; white-space: normal; text-align: left;
  transition: border-color 0.12s ease, background-color 0.12s ease; }
.pipe-btn:hover:not(:disabled) { border-color: var(--border); background: var(--surface); }
.pipe-btn.tone-you, .pipe-btn.tone-you:hover:not(:disabled) { background: var(--warn-bg); }
.pipe-btn.tone-fail, .pipe-btn.tone-fail:hover:not(:disabled) { background: var(--danger-bg); }
.pipe-track { position: relative; height: 12px; margin: 0 6px; }
.pipe-line, .pipe-fill { position: absolute; left: 0; top: 5px; height: 2px; border-radius: 1px; }
.pipe-line { right: 0; background: var(--border); }
.pipe-fill { background: var(--ok); }
.pipe-dot { position: absolute; top: 3px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; }
.pipe-dot.done { background: var(--ok); }
.pipe-dot.todo { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--border); }
.pipe-cursor { position: absolute; top: 0; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%;
  box-shadow: 0 0 0 2px var(--surface); transition: left 250ms cubic-bezier(0.77, 0, 0.175, 1); }
.pipe-cursor.t-work, .pipe-cursor.t-sched { background: var(--accent); }
.pipe-cursor.t-you { background: var(--warn); }
.pipe-cursor.t-done { background: var(--ok); }
.pipe-cursor.t-fail { background: var(--danger); }
.pipe-cursor.t-idle { background: var(--muted); }
.pipe-cursor.working { animation: pulse 1.2s linear infinite; }
.pipe-label { font-size: 12px; font-weight: 600; line-height: 1.3; }
.pipe-hold { font-size: 12px; font-weight: 600; line-height: 1.3; padding: 8px 10px; }
.tone-work .pipe-label, .tone-sched .pipe-label, .panel-now.tone-work, .panel-now.tone-sched { color: var(--accent); }
.tone-you .pipe-label, .panel-now.tone-you { color: var(--warn); }
.tone-done .pipe-label, .panel-now.tone-done { color: var(--ok); }
.tone-fail .pipe-label, .panel-now.tone-fail { color: var(--danger); }
.tone-idle .pipe-label, .panel-now.tone-idle { color: var(--muted); }
/* Hover or keyboard focus shows what is behind the stage without opening anything. */
.pipe-tip { position: absolute; z-index: 5; left: 0; top: calc(100% + 4px); width: max-content; max-width: 280px; padding: 8px 10px;
  background: var(--ink); color: var(--paper); border-radius: 6px; font-size: 12px; line-height: 1.45; box-shadow: var(--shadow);
  opacity: 0; visibility: hidden; transform: translateY(-2px); pointer-events: none;
  transition: opacity 150ms ease, transform 150ms ease, visibility 150ms; }
@media (hover: hover) and (pointer: fine) { .pipe-cell:hover .pipe-tip { opacity: 1; visibility: visible; transform: none; } }
.pipe-btn:focus-visible + .pipe-tip { opacity: 1; visibility: visible; transform: none; }
.play-btn { gap: 9px; min-height: 40px; padding: 0 14px 0 5px; border-radius: 999px; font-weight: 600; color: var(--accent);
  transition: border-color 0.12s ease, transform 120ms ease; }
.play-btn:active:not(:disabled) { transform: scale(0.96); background: var(--surface); }
.sp-wrap { position: relative; display: inline-block; }
.start-pill { display: inline-flex; align-items: stretch; height: 40px; border: 1px solid var(--accent); border-radius: 999px;
  background: var(--surface); overflow: hidden; }
.start-pill > button { min-height: 0; height: 100%; border: 0; border-radius: 0; background: transparent; transition: background-color 0.12s ease; }
.start-pill > button:hover:not(:disabled) { background: var(--hover); border: 0; }
.start-pill > button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.sp-begin { gap: 8px; padding: 0 14px 0 4px; color: var(--accent); font-weight: 700; }
.sp-opts { gap: 3px; padding: 0 8px 0 10px; border-left: 1px solid var(--border) !important; color: var(--muted); font-size: 12px; }
.sp-opts .num { font-variant-numeric: tabular-nums; }
.sp-opts .icon svg { width: 13px; height: 13px; }
.sp-opts[aria-expanded="true"] .icon { transform: rotate(180deg); }
.sp-cancel { width: 36px; padding: 0; border-left: 1px solid var(--border) !important; color: var(--muted); }
.sp-cancel .icon svg { width: 14px; height: 14px; }
.start-pill.is-busy { opacity: 0.7; }
.sp-pop { position: absolute; z-index: 6; top: calc(100% + 6px); left: 0; width: 260px; padding: 12px; display: flex; flex-direction: column; gap: 10px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); }
.play-circle { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent); color: var(--on-accent); }
.play-circle .icon, .play-circle svg { width: 14px; height: 14px; }
.play-circle .icon { margin-left: 2px; }   /* a triangle's visual centre sits right of its box centre */
#people-dlg { width: min(1040px, calc(100vw - 24px)); }
.panel-head { position: sticky; top: -4px; z-index: 4; margin: -4px -16px 14px; padding: 8px 16px 0; background: var(--surface);
  border-bottom: 1px solid var(--border); box-shadow: 0 6px 10px -10px var(--edge); }
.panel-pipe { padding: 4px 4px 12px; }
.approve-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding: 10px 0 12px;
  border-top: 1px solid var(--grid); }
.approve-bar .section-head { margin: 0; }
.group-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; margin-bottom: 8px; }
.group-bar .group-head { margin: 0; }
.pipe-track.big { height: 16px; margin: 6px 24px 0; }
.pipe-track.big .pipe-line, .pipe-track.big .pipe-fill { top: 7px; }
.pipe-track.big .pipe-dot { top: 5px; }
.pipe-track.big .pipe-cursor { top: 1px; width: 14px; height: 14px; margin-left: -7px; }
.pipe-names { display: grid; grid-template-columns: repeat(5, 1fr); margin-top: 6px; font-size: 11px; color: var(--muted); text-align: center; }
.pipe-names .done { color: var(--ok); }
.pipe-names .cur { font-weight: 700; }
.pipe-names .cur.t-work, .pipe-names .cur.t-sched { color: var(--accent); }
.pipe-names .cur.t-you { color: var(--warn); }
.pipe-names .cur.t-fail { color: var(--danger); }
.panel-now { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 10px; font-weight: 700; font-size: 14px; }
.panel-fail { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 14px; }
.panel-sec { margin-bottom: 18px; }
.c-role a { font-weight: 500; overflow-wrap: anywhere; }
.ext-folder { display: block; margin-top: 2px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tone-ok { color: var(--ok); } .tone-muted { color: var(--muted); } .tone-danger { color: var(--danger); } .tone-warn { color: var(--warn); }
.pill { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.danger { background: var(--danger-bg); color: var(--danger); }
.pill.neutral { background: var(--neutral-bg); color: var(--muted); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.link-btn { min-height: 0; padding: 0; border: 0; background: transparent; color: var(--accent); text-align: left; border-radius: 3px; }
.link-btn:hover:not(:disabled) { text-decoration: underline; border: 0; }
.working { display: inline-flex; align-items: center; gap: 7px; color: var(--accent); }
.working-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.err { color: var(--danger); margin-top: 4px; overflow-wrap: anywhere; }
.err.flush { margin: 0; }
.err.full { flex: 1 1 100%; margin: 0; }
.err.inrow { flex: 1 1 240px; margin: 0; }
.muted.inrow { flex: 1 1 240px; }
.person-title { font-weight: 400; }
.mt6 { margin-top: 6px; }
.empty.slim { max-width: 1120px; padding: 12px 14px; }
body { text-wrap: pretty; }
h2 { text-wrap: balance; }
.inline-form { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--paper); }
.field { display: flex; flex-direction: column; gap: 3px; }
.field > span { font-size: 11px; font-weight: 600; color: var(--muted); }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1 1 0; min-width: 0; }
input[type="text"], input[type="number"], input[type="url"], textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; min-height: 34px; }
textarea { resize: vertical; line-height: 1.5; }
input:focus, textarea:focus { border-color: var(--accent); }
.form-actions { display: flex; gap: 8px; }

.empty { padding: 28px 4px; color: var(--muted); font-size: 14px; }
.empty.boxed { border: 1px dashed var(--border); border-radius: 6px; padding: 18px 14px; font-size: 13px; }

@media (max-width: 1180px) {

      h('div', { class: 'ic-head' },
        h('div', { class: 'ic-title' }, h('strong', null, j.company || ''), j.title ? h('span', { class: 'muted' }, ', ' + j.title) : null),
        h('span', { class: 'pill ' + st[2], title: 'Where the application stands now' }, st[1]),
        handoffLinks(j),
        acts.firstChild ? acts : null),
      errs.length ? h('div', { class: 'err' }, errs[0]) : null,
      h('div', { class: 'ic-lines' }, shown.map(function (i) { return emailRow(i, jobs, { card: true, noUndo: i === uTarget }); })));
    if (g.emails.length > 1) {
      card.appendChild(h('button', { type: 'button', class: 'link-btn ic-more', 'aria-expanded': String(open), 'data-fk': 'ic-more-' + j.id,
        onclick: function () { S.inboxOpen[j.id] = !open; render(); } }, open ? 'Show fewer' : (g.emails.length - 1) + ' earlier'));
    }
    return card;
  }
  var TIMELINE = ['rejection', 'paused', 'interview', 'assessment', 'reply'];
  function renderInbox(root) {
    var d = S.inbox;
    if (!d) { root.appendChild(h('div', { class: 'empty' }, S.down ? 'The inbox is not loaded yet.' : 'Loading the inbox')); return; }
    var items = d.items || [], jobs = d.jobs || [], busy = !!S.busy.inboxcheck || d.busy;
    root.appendChild(h('div', { class: 'inbox-bar' },
      h('span', { class: 'muted' }, d.last_checked ? 'Last read ' + fmtDT(d.last_checked) + '. Reads every 30 minutes and before each send.' : 'Not read yet.'),
      h('button', { type: 'button', class: 'btn-sm', disabled: busy, 'data-fk': 'inbox-check',
        onclick: function () { post('inboxcheck', '/api/inbox/check', {}); } }, busy ? 'Reading' : 'Read inbox now'),
      d.error ? h('div', { class: 'err full' }, 'Last read had a problem: ' + d.error) : null,
      S.errors.inboxcheck ? h('div', { class: 'err full' }, S.errors.inboxcheck) : null));
    // The Jobs row's Inbox cell links here with one job: show only its emails, and say so.
    var only = S.inboxJob, onlyJob = null;
    if (only) {
      onlyJob = jobs.filter(function (o) { return o.id === only; })[0] || (items.filter(function (i) { return i.job_id === only; })[0] || {}).job || null;
      items = items.filter(function (i) { return i.job_id === only; });
      root.appendChild(h('div', { class: 'inbox-bar filter-bar' },
        h('span', null, 'Emails about ', h('strong', null, onlyJob ? (onlyJob.company || '') + (onlyJob.title ? ', ' + onlyJob.title : '') : 'one job')),
        h('a', { class: 'btn btn-sm', href: '#inbox', 'data-fk': 'inbox-all' }, 'Show all')));
    }
    var live = items.filter(function (i) { return i.status !== 'undone'; });
    // What needs you is decided on the server (inbox_needs), so this section, the strip and the bell agree.
    var needSet = {};
    (d.needs || []).forEach(function (id) { needSet[id] = true; });
    var needs = live.filter(function (i) { return needSet[i.id]; });

    // A job's conversation: its rejections, interviews, assessments and replies, newest first. Each job is one
    // card, filed under the first of Needs you, Rejections, In conversation that applies to it.
    var groups = {}, order = [];
    live.forEach(function (i) {
      if (!i.job_id || !i.job || TIMELINE.indexOf(i.kind) === -1) return;
      var g = groups[i.job_id] || (groups[i.job_id] = { job: i.job, emails: [], needs: [] });
      if (!g.emails.length) order.push(g);
      g.emails.push(i);
      if (needSet[i.id]) g.needs.push(i);
    });
    // Your own replies sit in the timeline of a job that already has a card; alone they do not make one.
    live.forEach(function (i) {
      if (i.kind === 'my_reply' && i.job_id && groups[i.job_id]) groups[i.job_id].emails.push(i);
    });
    order.forEach(function (g) { g.emails.sort(function (a, b) { return a.received_at < b.received_at ? 1 : a.received_at > b.received_at ? -1 : 0; }); });
    var needsCards = order.filter(function (g) { return g.needs.length; });
    var rejCards = order.filter(function (g) { return !g.needs.length && g.emails.some(function (i) { return i.kind === 'rejection'; }); });
    var talkCards = order.filter(function (g) { return needsCards.indexOf(g) === -1 && rejCards.indexOf(g) === -1; });
    var unmatchedNeeds = needs.filter(function (i) { return !i.job_id; });
    // Mail from a company you are not tracking that says something (an interview, an assessment, a reply, a pause): it has
    // no card to live on, so it is listed here with Add as a job, which is the way to start tracking it.
    var loose = live.filter(function (i) { return !i.job_id && ['interview', 'assessment', 'reply', 'paused'].indexOf(i.kind) !== -1; });
    var away = live.filter(function (i) { return i.kind === 'out_of_office'; });
    var otherRej = live.filter(function (i) { return i.kind === 'rejection' && !i.job && !needSet[i.id]; });
    var rest = items.filter(function (i) { return i.status === 'undone' || ['received', 'other'].indexOf(i.kind) !== -1; });

    function cards(gs) { return gs.map(function (g) { return jobCard(g, jobs); }); }
    function sec(title, count, kids, emptyText) {
      if (only && !count) return;
      root.appendChild(section(title, count, h('div', { class: 'inbox-list' }, kids), emptyText));
    }
    // Cards and the unmatched rows that need you, newest first. The count is what the strip says (emails), not cards.
    var needsKids = needsCards.map(function (g) { return { at: g.emails[0].received_at, node: jobCard(g, jobs) }; })
      .concat(unmatchedNeeds.map(function (i) { return { at: i.received_at, node: h('div', { class: 'compact' }, emailRow(i, jobs)) }; }))
      .sort(function (a, b) { return a.at < b.at ? 1 : a.at > b.at ? -1 : 0; }).map(function (x) { return x.node; });
    sec('Needs you', needs.length, needsKids, 'Nothing to confirm.');
    sec('Rejections', rejCards.length, cards(rejCards), 'No rejections on jobs you are tracking.');
    if (loose.length) sec('Not matched to a job', loose.length, h('div', { class: 'compact' }, loose.map(function (i) { return emailRow(i, jobs); })), 'None.');
    if (otherRej.length) sec('Rejections for jobs not tracked', otherRej.length, h('div', { class: 'compact' }, otherRej.map(function (i) { return emailRow(i, jobs); })),
      'None.');
    sec('Away replies', away.length, h('div', { class: 'compact' }, away.map(function (i) { return emailRow(i, jobs); })), 'No away replies.');
    sec('In conversation', talkCards.length, cards(talkCards), 'None yet.');
    if (only && !items.length) root.appendChild(h('div', { class: 'empty boxed slim' }, 'No emails about this job.'));
    var folded = [];
    if (rest.length) folded.push(plural(rest.length, 'acknowledgement or other email', 'acknowledgements and other emails'));
    if (folded.length) {
      root.appendChild(h('details', { class: 'section inbox-more' },
        h('summary', null, folded.join(', ')),
        h('div', { class: 'compact' }, rest.map(function (i) { return emailRow(i, jobs); }))));
    }
  }

  // ---------- Monitor tab ----------
  function sw(label, on, key, onclick) {
    return h('button', { type: 'button', class: 'switch', role: 'switch', 'aria-checked': String(!!on), disabled: !!S.busy[key], 'data-fk': 'sw-' + key, onclick: onclick },
      h('span', { class: 'sw-track' }, h('span', { class: 'sw-thumb' })), label);
  }
  function setSetting(key, body) {
    S.busy[key] = true; delete S.errors[key]; render();
    return api('POST', '/settings', body).then(function (res) {
      S.busy[key] = false;
      if (!res.ok) S.errors[key] = errText(res);
      S.autoConfirm = false;
      return res.ok ? refreshNow() : render();
    }, function () { S.busy[key] = false; S.errors[key] = 'Cannot reach the server.'; render(); });
  }
  function kv(pairs) {
    var dl = h('dl', { class: 'kv' });
    pairs.forEach(function (p) { dl.appendChild(h('dt', null, p[0])); dl.appendChild(h('dd', { class: p[2] || null }, p[1])); });
    return dl;
  }
  function miniTable(cols, rows, emptyText) {
    if (!rows.length) return h('div', { class: 'muted' }, emptyText);
    return h('table', { class: 'mini' },
      h('thead', null, h('tr', null, cols.map(function (c, i) { return h('th', { scope: 'col', class: i > 0 && c[1] ? 'r' : null }, c[0]); }))),
      h('tbody', null, rows.map(function (r) { return h('tr', null, r.map(function (v, i) { return h('td', { class: i > 0 && cols[i][1] ? 'r' : null }, v); })); })));
  }

  function renderMonitor(root) {
    var m = S.monitor;
    if (!m) { root.appendChild(h('div', { class: 'empty' }, S.down ? 'Monitor data is not loaded yet.' : 'Loading monitor')); return; }
    var s = m.sending || {}, q = m.quality || {}, sp = m.spend || {};
    if (S.profile && !feat('outreach') && !feat('email')) {
      root.appendChild(h('div', { class: 'empty' }, 'The Monitor tracks outreach spend, draft quality, sending and email. ' +
        'Outreach and email are both off; turn them on in profile/profile.yaml (docs/outreach.md, docs/email.md).'));
      return;
    }
    var grid = h('div', { class: 'mon-grid' });

    // Sending
    var sendSec = h('section', { 'data-feature': 'outreach' }, h('h2', null, 'Sending'),
      kv([
        ['Sent today', or(s.sent_today, 0) + ' of ' + or(s.daily_cap, 0), 'big'],
        ['Window', s.window || ''],
        ['Gap', s.gap_minutes ? s.gap_minutes[0] + ' to ' + s.gap_minutes[1] + ' minutes' : ''],
        ['Next send', s.next_send_at ? fmtDT(s.next_send_at) : 'none scheduled']
      ]));
    var switches = h('div', { class: 'switches' },
      sw('Approve people automatically', m.people_auto, 'people', function () { setSetting('people', { people_auto: !m.people_auto }); }),
      sw('Auto mode', m.auto, 'auto', function () {
        if (m.auto) setSetting('auto', { outreach_auto: false });
        else { S.autoConfirm = !S.autoConfirm; render(); }
      }));
    if (S.errors.people) switches.appendChild(h('div', { class: 'err' }, S.errors.people));
    if (S.errors.auto) switches.appendChild(h('div', { class: 'err' }, S.errors.auto));
    if (S.autoConfirm && !m.auto) {
      switches.appendChild(h('div', { class: 'confirm', role: 'group', 'aria-label': 'Confirm auto mode' },
        h('p', null, 'Turn on auto mode? Drafts that pass the checks will send without your click, inside the same window and the cap of ' + or(s.daily_cap, 0) + ' a day.'),
        h('div', { class: 'form-actions' },
          h('button', { type: 'button', class: 'btn-primary', 'data-fk': 'auto-yes', onclick: function () { setSetting('auto', { outreach_auto: true }); } }, 'Turn on'),
          h('button', { type: 'button', 'data-fk': 'auto-no', onclick: function () { S.autoConfirm = false; render(); } }, 'Cancel'))));
    }
    switches.appendChild(sw('Pause sending', m.paused, 'paused', function () { setSetting('paused', { outreach_paused: !m.paused }); }));
    if (S.errors.paused) switches.appendChild(h('div', { class: 'err' }, S.errors.paused));
    sendSec.appendChild(switches);
    grid.appendChild(sendSec);

    // Delivery: whether guessed addresses earn their keep.
    var b = m.bounces || {}, bs = b.by_source || {};
    function rate(x) { x = x || { sent: 0, bounced: 0 }; var n = x.sent + x.bounced; return n ? x.bounced + ' of ' + n + ' bounced' : 'none sent'; }
    var delSec = h('section', { 'data-feature': 'email' }, h('h2', null, 'Delivery'),
      kv([
        ['Guessed addresses', rate(bs.guessed)],
        ['Confirmed addresses', rate(bs.verified)],
        ['Last checked', b.last_checked ? fmtDT(b.last_checked) : 'not yet', b.error ? 'err' : null]
      ]),
      h('div', { class: 'form-actions' },
        h('button', { type: 'button', class: 'btn-sm', disabled: !!S.busy.bounces, 'data-fk': 'bounce-check',
          onclick: function () { post('bounces', '/api/bounces/check', {}); } }, S.busy.bounces ? 'Checking' : 'Check now')),
      b.error ? h('div', { class: 'err' }, 'Last check failed: ' + b.error) : null,
      S.errors.bounces ? h('div', { class: 'err' }, S.errors.bounces) : null);
    grid.appendChild(delSec);

    // Your own sent replies, waiting for a review by the learn skill. Not read by the drafter.
    var hr = (m.inbox || {}).my_replies || { waiting: 0, total: 0 };
    grid.appendChild(h('section', { 'data-feature': 'email' }, h('h2', null, 'Your replies'),
      kv([
        ['Waiting for review', String(hr.waiting), hr.waiting ? 'big' : null],
        ['In the file', String(hr.total)],
        ['File', (m.inbox || {}).my_replies_file || 'data/my-replies.md', 'mono']
      ]),
      h('p', { class: 'muted' }, hr.waiting
        ? 'Run /learn in Claude Code over the new entries, then add a "## Reviewed" line with the date at the end of the file.'
        : 'Nothing new since the last review. The drafter does not read this file.')));

    // Quality
    var qSec = h('section', { 'data-feature': 'outreach' }, h('h2', null, 'Draft quality'),
      kv([
        ['Drafts', String(or(q.drafts, 0))],
        ['Decided', String(or(q.decided, 0))],
        ['Edited', String(or(q.edited, 0))],
        ['Edit rate', pct(q.edit_rate), 'big'],
        ['Average audit', q.avg_audit === null || q.avg_audit === undefined ? 'no data yet' : String(q.avg_audit)],
        ['Repaired', String(or(q.repaired, 0))]
      ]),
      h('h3', null, 'By week'),
      miniTable([['Week'], ['Drafts', true], ['Average audit', true]],
        (q.by_week || []).map(function (w) { return [w.week, String(w.drafts), w.avg_audit === null || w.avg_audit === undefined ? 'no data yet' : String(w.avg_audit)]; }), 'No drafts yet.'));
    grid.appendChild(qSec);

    // Spend
    var spSec = h('section', { 'data-feature': 'outreach' }, h('h2', null, 'Spend'),
      kv([
        ['Total, estimated', usd(sp.total_usd), 'big'],
        ['People searches', String(or(sp.apify_calls, 0))],
        ['Email lookups', String(or(sp.email_calls, 0))]
      ]),
      h('h3', null, 'By week, estimated'),
      miniTable([['Week'], ['Searches', true], ['Email lookups', true], ['Est. USD', true]],
        (sp.by_week || []).map(function (w) { return [w.week, String(or(w.apify, 0)), String(or(w.email, 0)), usd(w.usd)]; }), 'No paid calls yet.'),
      h('h3', null, 'By job, estimated'),
      miniTable([['Job'], ['Calls', true], ['Est. USD', true]],
        (sp.by_job || []).map(function (j) {
          return [[h('strong', null, j.company || ''), h('div', { class: 'muted' }, j.title || '')], String(or(j.apify, 0) + or(j.email, 0)), usd(j.usd)];
        }), 'No paid calls yet.'));
    grid.appendChild(spSec);
    root.appendChild(grid);
  }

  // ---------- routing and boot ----------
  function route() {
    // "#inbox?job=<id>" is the Inbox tab filtered to one job; plain "#inbox" clears the filter.
    var parts = (location.hash || '').replace('#', '').split('?'), t = parts[0], jm = /(?:^|&)job=([^&]*)/.exec(parts[1] || '');
    S.tab = TABS.indexOf(t) !== -1 ? t : 'jobs';
    S.inboxJob = S.tab === 'inbox' && jm ? decodeURIComponent(jm[1]) : null;
    // "#jobs?add=<company>&li=<company linkedin link>" (from the side panel's captured person) opens the add form filled in.
    var am = /(?:^|&)add=([^&]*)/.exec(parts[1] || ''), lm = /(?:^|&)li=([^&]*)/.exec(parts[1] || '');
    if (S.tab === 'jobs' && am) {
      S.addForm = newAddForm({ company: decodeURIComponent(am[1]), company_url: lm ? decodeURIComponent(lm[1]) : '' });
      S.addOpen = true;
    }
    S.autoConfirm = false;
    render();
    refreshNow();
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refreshNow(); });
  route();
})();
</script>
</body>
</html>

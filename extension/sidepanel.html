<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JD Intake</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header id="topbar">
    <!-- The eye is the one thing you press on every job, so it is a square as tall as the
         search box and the filter pills together, with everything else stacked beside it. -->
    <div id="top-main">
      <button id="capture-btn" type="button" aria-label="Look at this page" title="Look at this page (Cmd+Shift+J)">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></span>
      </button>
      <div id="top-stack">
      <div id="health-row">
      <!-- Search: title, company, location and the full job description of every job, old or new. -->
      <div id="search-box">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16" y2="16"></line></svg></span>
        <input id="search-input" type="search" placeholder="Search" aria-label="Search jobs and descriptions" title="Searches titles, companies, locations and every job description" autocomplete="off" spellcheck="false">
      </div>
      <!-- Auto-build: the bolt alone, green when on. The tooltip carries the words. -->
      <button id="auto-badge" type="button" aria-pressed="false" aria-label="Auto-build" hidden></button>
      <!-- LinkedIn mode: the connection notes waiting on you, worked through one profile at a time. Shown only when outreach is on. -->
      <button id="li-btn" type="button" aria-pressed="false" aria-label="LinkedIn notes" title="LinkedIn notes" hidden>
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><line x1="19" y1="8" x2="19" y2="14"></line><line x1="16" y1="11" x2="22" y2="11"></line></svg></span>
        <span id="li-count" class="bell-count" hidden></span>
      </button>
      <!-- What is waiting on you in the outreach queue; opens the dashboard on the server. -->
      <button id="bell-btn" type="button" aria-label="Open the dashboard" title="Open the dashboard">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg></span>
        <span id="bell-count" class="bell-count" hidden></span>
      </button>
      <button id="settings-btn" type="button" aria-label="Settings" aria-expanded="false" title="Settings">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span>
      </button>
      </div>
      <div id="filter-row" role="tablist" hidden aria-label="Filter jobs">
      <button type="button" class="filter-btn active" data-filter="active" role="tab" aria-selected="true" aria-label="Active" title="Active"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l2 3h4l2-3h5"></path><path d="M5.5 5h13L21 13v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"></path></svg></span><span class="filter-label">Active</span> <span class="filter-count" id="count-active">0</span></button>
      <button type="button" class="filter-btn" data-filter="process" role="tab" aria-selected="false" aria-label="In process" title="In process"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h11a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H9l-4 3v-3H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"></path><path d="M16 9h4a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-1v3l-4-3h-4a1 1 0 0 1-1-1v-2"></path></svg></span><span class="filter-label">In process</span> <span class="filter-count" id="count-process">0</span></button>
      <button type="button" class="filter-btn" data-filter="applied" role="tab" aria-selected="false" aria-label="Applied" title="Applied"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 L20 4 L13 21 L11 13 Z"></path></svg></span><span class="filter-label">Applied</span> <span class="filter-count" id="count-applied">0</span></button>
      <button type="button" class="filter-btn" data-filter="skipped" role="tab" aria-selected="false" aria-label="Skipped" title="Skipped"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 5 14 12 5 19 5 5"></polygon><line x1="18" y1="5" x2="18" y2="19"></line></svg></span><span class="filter-label">Skipped</span> <span class="filter-count" id="count-skipped">0</span></button>
      <button type="button" class="filter-btn" data-filter="all" role="tab" aria-selected="false" aria-label="All" title="All"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="20" y2="6"></line><line x1="8" y1="12" x2="20" y2="12"></line><line x1="8" y1="18" x2="20" y2="18"></line><circle cx="4" cy="6" r="0.6"></circle><circle cx="4" cy="12" r="0.6"></circle><circle cx="4" cy="18" r="0.6"></circle></svg></span><span class="filter-label">All</span> <span class="filter-count" id="count-all">0</span></button>
      </div>
      </div>
    </div>
    <div id="warning-line" class="warning" hidden></div>
    <div id="banner" class="banner" hidden></div>
    <div id="settings-row" hidden>
      <span id="health-dot" class="dot" title="Server health"></span><span id="health-text">Checking server...</span>
      <label class="settings-item">
        <input type="checkbox" id="auto-toggle">
        Auto
      </label>
      <label class="settings-item">
        Threshold
        <input type="number" id="threshold-input" min="0" max="100" step="1" value="70">
      </label>
      <label class="settings-item" title="Model for tailored builds and cover letters">
        Build
        <select id="build-model"><option value="opus">Opus</option><option value="sonnet">Sonnet</option></select>
      </label>
      <!-- Where the jd-intake server listens. A port other than 8790 also needs host_permissions in manifest.json. -->
      <label class="settings-item settings-server" title="Address of the jd-intake server">
        Server
        <input type="text" id="server-input" value="http://127.0.0.1:8790" spellcheck="false" autocomplete="off" aria-label="Server address">
        <button type="button" id="server-save" class="link-btn">Save</button>
      </label>
    </div>
  </header>

  <main id="jobs-list" aria-live="polite"></main>
  <main id="li-view" hidden aria-label="LinkedIn notes"></main>

  <script src="sidepanel.js"></script>
</body>
</html>
